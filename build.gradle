plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'neothaum' }

repositories {
	maven { name = 'Jared (JEI)'; url = 'https://maven.blamejared.com/' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"neothaum" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client gametests double as a visual harness: they build scenes and save screenshots for side-by-side checks against TC4.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "neothaum-visual-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	// only resolved for NEOTHAUM_TEST_TRINKETS runs
	trinketsTest { transitive = false }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "mezz.jei:jei-26.3-fabric-api:${project.jei_version}"
	runtimeOnly "mezz.jei:jei-26.3-fabric:${project.jei_version}"

	compileOnly files("run/mods/Jade-mc26.3-Fabric-26.3.5.jar")
	compileOnly files("run/mods/modmenu-21.0.0.jar")
	// Trinkets Updated (Patbox's fork of Trinkets for 26.3): optional accessory slots for the baubles
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	trinketsTest "maven.modrinth:trinkets-updated:${project.trinkets_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('printClasspath') {
	def cp = sourceSets.client.compileClasspath
	doLast { file("${rootDir}/original/classpath.txt").text = cp.files.join(File.pathSeparator) }
}

// NEOTHAUM_TEST_XAERO=1 loads Xaero's World Map into the client gametest run, for the "worldmap" scene
if (System.getenv("NEOTHAUM_TEST_XAERO") != null) {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dfabric.addMods=${file('run/mods/xaeroworldmap-fabric-26.3-1.47.2.jar').absolutePath}"
	}
}

// NEOTHAUM_TEST_TRINKETS=1 loads Trinkets Updated into the client gametest run, for the "trinkets" scene
if (System.getenv("NEOTHAUM_TEST_TRINKETS") != null) {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dfabric.addMods=${configurations.trinketsTest.singleFile.absolutePath}"
	}
}
