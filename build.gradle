plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'thaumvibe4' }

repositories {
	maven { name = 'Jared (JEI)'; url = 'https://maven.blamejared.com/' }
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"thaumvibe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client gametests double as a visual harness: they build scenes and save screenshots for side-by-side checks against TC4.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "thaumvibe-visual-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "mezz.jei:jei-26.3-fabric-api:${project.jei_version}"
	runtimeOnly "mezz.jei:jei-26.3-fabric:${project.jei_version}"

	compileOnly files("run/mods/Jade-mc26.3-Fabric-26.3.5.jar")
	compileOnly files("run/mods/xaerominimap-fabric-26.3-26.6.2.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('printClasspath') {
	def cp = sourceSets.client.compileClasspath
	doLast { file("${rootDir}/original/classpath.txt").text = cp.files.join(File.pathSeparator) }
}
