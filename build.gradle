plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'neothaum' }

repositories {
	maven { name = 'Jared (JEI)'; url = 'https://maven.blamejared.com/' }
	maven {
		name = 'shedaniel (Cloth math for REI)'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup 'me.shedaniel.cloth' }
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"neothaum" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client gametests double as a visual harness: they build scenes and save screenshots for side-by-side checks against TC4.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "neothaum-visual-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	// mods loaded into a client gametest run only when asked for (NEOTHAUM_TEST_MODS, below); never bundled
	trinketsTest { transitive = false }
	dynlightsTest { transitive = false }
	sodiumTest { transitive = false }
	irisTest { transitive = false }
	appleskinTest { transitive = false }
	reiTest { transitive = false }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "mezz.jei:jei-26.3-fabric-api:${project.jei_version}"
	runtimeOnly "mezz.jei:jei-26.3-fabric:${project.jei_version}"

	compileOnly files("run/mods/Jade-mc26.3-Fabric-26.3.5.jar")
	compileOnly files("run/mods/modmenu-21.0.0.jar")
	// Trinkets Updated (Patbox's fork of Trinkets for 26.3): optional accessory slots for the baubles
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	trinketsTest "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	// AppleSkin and REI: optional integrations (food values; recipe pages like the JEI plugin's)
	compileOnly "maven.modrinth:appleskin:${project.appleskin_version}"
	appleskinTest "maven.modrinth:appleskin:${project.appleskin_version}"
	compileOnly "maven.modrinth:rei:${project.rei_version}"
	// REI's widget API uses Cloth's math types (Point, Rectangle), which Cloth Config only carries as a nested jar
	compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
	// and REI's EntryStacks overloads mention Architectury's FluidStack
	compileOnly "maven.modrinth:architectury-api:${project.architectury_version}"
	reiTest "maven.modrinth:rei:${project.rei_version}"
	reiTest "maven.modrinth:cloth-config:${project.cloth_config_version}"
	reiTest "maven.modrinth:architectury-api:${project.architectury_version}"
	// Iris: its API maps NeoThaum's custom render pipelines to shader-pack programs (dev.neothaum.client.addon.IrisCompat)
	compileOnly "maven.modrinth:iris:${project.iris_version}"
	// LambDynamicLights: wisps light their surroundings when it is installed (dev.neothaum.client.addon.WispDynamicLights)
	compileOnly "maven.modrinth:lambdynamiclights:${project.lambdynamiclights_version}"
	dynlightsTest "maven.modrinth:lambdynamiclights:${project.lambdynamiclights_version}"
	// Sodium is only checked against
	sodiumTest "maven.modrinth:sodium:${project.sodium_version}"
	irisTest "maven.modrinth:sodium:${project.sodium_version}"
	irisTest "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.register('printClasspath') {
	def cp = sourceSets.client.compileClasspath
	doLast { file("${rootDir}/original/classpath.txt").text = cp.files.join(File.pathSeparator) }
}

// NEOTHAUM_TEST_XAERO=1 loads Xaero's World Map into the client gametest run, for the "worldmap" scene
if (System.getenv("NEOTHAUM_TEST_XAERO") != null) {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dfabric.addMods=${file('run/mods/xaeroworldmap-fabric-26.3-1.47.2.jar').absolutePath}"
	}
}

// NEOTHAUM_TEST_MODS=trinkets,sodium,iris,appleskin,rei,dynlights loads those mods into the client gametest run (NEOTHAUM_TEST_TRINKETS=1 still means
// trinkets). Each name is the <name>Test configuration above.
def testMods = (System.getenv("NEOTHAUM_TEST_MODS") ?: "").split(",").collect { it.trim() }.findAll { it }
if (System.getenv("NEOTHAUM_TEST_TRINKETS") != null) {
	testMods += "trinkets"
}
if (!testMods.isEmpty()) {
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		def jars = testMods.unique().collectMany { configurations.getByName(it + "Test").files.collect { f -> f.absolutePath } }
		vmArg "-Dfabric.addMods=${jars.join(File.pathSeparator)}"
	}
}
